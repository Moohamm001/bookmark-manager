# One command to run both services:  docker compose up --build
#
# Ports are not arbitrary. The frontend MUST be on 3000 — the Auth0 tenant registers
# http://localhost:3000/callback as the only allowed callback URL, and Auth0 requires an
# exact match. The API takes 4000 to stay out of its way.
services:
  api:
    build: ./backend
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: file:/data/dev.db
      AUTH0_ISSUER: https://dev-yg.us.auth0.com/
      AUTH0_AUDIENCE: https://bbl-candidate-test-api
      AUTH0_JWKS_URI: https://dev-yg.us.auth0.com/.well-known/jwks.json
      CORS_ORIGIN: http://localhost:3000
      PORT: '4000'
    volumes:
      - api-data:/data

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  api-data:
