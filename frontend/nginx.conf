server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: every unknown path must serve index.html so React Router can handle it.
  # Without this, a hard refresh on /collections/abc 404s — and so does /callback, which
  # breaks login specifically.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
